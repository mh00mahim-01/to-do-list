<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <main class="signin_container">

        <!-- Left decorative section -->
        <section class="art" aria-hidden="true">

            <h2 class="site-name">
                sign into your<br>
                <span>appName</span>
            </h2>

        </section>


        <!-- Main sign-in form -->
        <section class="panel">

            <form class="form" action="#" method="post">

                <h1>Sign In</h1>


                <!-- Email -->
                <label class="email-input">

                    <span class="email-icon">✉</span>

                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    >

                </label>


                <!-- Password -->
                <label class="password-input">

                    <span class="password-icon">🔒</span>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                </label>


                <!-- Sign In button -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Sign In
                </button>


                <!-- Separator -->
                <div class="separator">
                    <span>or continue with</span>
                </div>


                <!-- Social buttons -->
                <div class="social-buttons">

                    <button
                        type="button"
                        class="social-btn google"
                    >
                        <span class="social-icon">G</span>
                        <span class="social-text">Google</span>
                    </button>


                    <button
                        type="button"
                        class="social-btn facebook"
                    >
                        <span class="social-icon">F</span>
                        <span class="social-text">Facebook</span>
                    </button>

                </div>


                <!-- Sign up -->
                <p class="signup-link">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                </p>

            </form>

        </section>

    </main>
 <script src="script.js"></script>
</body>

</html>
