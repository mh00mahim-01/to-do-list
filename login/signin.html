<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>


<body>

    <main class="signin_container" id="signinContainer">

        <!-- Left decorative section -->
        <section class="art" id="artSection" aria-hidden="true">

            <h2 class="site-name" id="siteName">
                sign into your<br>
                <span id="appName">appName</span>
            </h2>

        </section>


        <!-- Main sign-in form -->
        <section class="panel" id="panelSection">

            <form class="form" id="signinForm" action="#" method="post">

                <h1 id="formTitle">Sign In</h1>


                <!-- Email -->
                <label class="email-input" id="emailLabel">

                    <span class="email-icon" id="emailIcon">✉</span>

                    <input
                        type="email"
                        id="emailInput"
                        name="email"
                        placeholder="Email"
                        required
                    >

                </label>


                <!-- Password -->
                <label class="password-input" id="passwordLabel">

                    <span class="password-icon" id="passwordIcon">🔒</span>

                    <input
                        type="password"
                        id="passwordInput"
                        name="password"
                        placeholder="Password"
                        required
                    >

                </label>


                <!-- Sign In button -->
                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    Sign In
                </button>


                <!-- Separator -->
                <div class="separator" id="separator">
                    <span id="separatorText">or continue with</span>
                </div>


                <!-- Social buttons -->
                <div class="social-buttons" id="socialButtons">

                    <button
                        type="button"
                        class="social-btn google"
                        id="googleBtn"
                    >
                        <span class="social-icon" id="googleIcon">G</span>
                        <span class="social-text" id="googleText">Google</span>
                    </button>


                    <button
                        type="button"
                        class="social-btn facebook"
                        id="facebookBtn"
                    >
                        <span class="social-icon" id="facebookIcon">F</span>
                        <span class="social-text" id="facebookText">Facebook</span>
                    </button>

                </div>


                <!-- Sign up -->
                <p class="signup-link" id="signupLinkWrapper">
                    Don't have an account?
                    <a href="signup.html" id="signupLink">Sign Up</a>
                </p>

            </form>

        </section>

    </main>
 <script src="script.js"></script>
</body>

</html>
